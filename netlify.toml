[build]
  command = "cd frontend && npm run build"
  publish = "frontend/.next"

[functions]
  included_files = ["core/**", "data/**", "main.py"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Next.js handles its own routing, so we don't need a catch-all to index.html

[context.production.environment]
  PYTHON_VERSION = "3.10"
  NEXT_PUBLIC_API_URL = "/api/v1"
